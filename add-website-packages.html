<!doctype html><html lang="zh-HK"><meta charset="utf-8"><title>加入網站套餐分頁</title><body style="font-family:sans-serif;max-width:800px;margin:40px auto;line-height:1.8"><h1>加入網站套餐分頁</h1><p>請選擇你目前使用的「計算器」index.html，唔係公司宣傳網站index.html。工具只會在你電腦處理檔案，不上傳資料。原有程式及套餐檔不改動。</p><input type="file" id="file" accept=".html"><p id="status"></p><script>const code="(()=>{if(document.getElementById('website-package-view'))return;const data=[{\"name\": \"細單位 ｜ 基礎優化\", \"group\": \"清水樓優化\", \"area\": \"實用面積：250 - 350 呎 (約 1-2 人)\", \"price\": 88000, \"features\": [\"基本水電延伸 保留原裝電箱，新增/改位共 12 個暗線電位。代安裝全屋燈飾。\", \"防霉油漆及地板 局部修補平整，塗刷 3 層立邦防霉漆。全屋直鋪 SPC 鎖扣地板。\", \"精選 12呎 E0訂造傢俬 4呎 鞋櫃 4呎 電視櫃 4呎 衣櫃\"]}, {\"name\": \"中單位 ｜ 全面升級\", \"group\": \"清水樓優化\", \"area\": \"實用面積：360 - 450 呎 (約 3-4 人)\", \"price\": 148000, \"features\": [\"水電擴充與隔音間房 新增共 20 個入牆暗線位。新建防潮石膏板間牆連隔音棉。\", \"全屋高階油漆處理 塗刷 3 層立邦金裝五合一漆. 升級加厚 SPC 地板。\", \"海量 22呎傢俬 ＋ 60呎地台 5呎 C字鞋櫃 6呎 特色電視牆櫃 7呎 衣櫃 4呎 床斗 60呎 榻榻米地台\"]}, {\"name\": \"大單位 ｜ 尊尚豪裝\", \"group\": \"清水樓優化\", \"area\": \"實用面積：460 - 600+ 呎 (多房佈局)\", \"price\": 198000, \"features\": [\"智能家居準備 (水電網) 新增高達 30 個電位，預留智能開關零線。全屋剷底重批。\", \"極致 35呎傢俬 ＋ 100呎地台 8呎 岩板電視牆 100呎 雙房地台 12呎 通頂衣櫃 6呎 玄關櫃 5呎 書枱組合\"]}, {\"name\": \"細單位 ｜ 核心全爆\", \"group\": \"舊樓全爆\", \"area\": \"實用面積：250 - 350 呎\", \"price\": 178000, \"features\": [\"清拆與重型防水 全爆 1廚 1廁。廚廁塗刷 3 層黑豹防水，保證 48小時試水。\", \"水電換新 (安全標準) 新造 25 個暗線電位。更換全新施耐德總電箱。\", \"廚廁專屬 19呎傢俬 8呎 廚房廚櫃 8呎 無縫石枱面 3呎 浴室地鏡櫃\"]}, {\"name\": \"中單位 ｜ 深度大全爆\", \"group\": \"舊樓全爆\", \"area\": \"實用面積：360 - 450 呎\", \"price\": 248000, \"features\": [\"極致清拆與重整格局 包大規模打鑿及拆舊間隔。新造 45 個電位，設獨立迴路。\", \"平水泥水工藝 紅外線平水鋪磚。包天然雲石門檻及鋁質假天花。\", \"客廳及廚廁 42呎豪華傢俬 12呎 L型廚櫃 12呎 石英石枱面 4呎 洗手盆鏡櫃 6呎 C字櫃 8呎 大衣櫃\"]}, {\"name\": \"大單位 ｜ 尊尚大全爆\", \"group\": \"舊樓全爆\", \"area\": \"實用面積：460 - 600+ 呎 (雙廁所)\", \"price\": 328000, \"features\": [\"雙廁所及大型清拆 包拆 1廚 2廁。雙廁所皆施作重防水。新造高達 65 個電位。\", \"海量全屋 65呎 訂造傢俬 15呎 U型大廚櫃 雙廁所 鏡櫃及地櫃 (共7呎) 20呎 睡房大衣櫃組合 8呎 客廳特色儲物牆\"]}],bar=document.querySelector('.app-tabs');if(!bar){alert('未找到計算器分頁，請將此更新加到計算器，而非公司宣傳網站。');return;}const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));const cash=n=>'HK$ '+Number(n).toLocaleString('en-HK',{maximumFractionDigits:2});const unit=n=>Math.ceil(Number(n));let selected=0;const saved=data.map(p=>[{name:p.name,qty:1,price:p.price}]);const btn=document.createElement('button');btn.type='button';btn.id='tab-website-package';btn.role='tab';btn.tabIndex=-1;btn.setAttribute('aria-selected','false');btn.setAttribute('aria-controls','website-package-view');btn.textContent='網站套餐';bar.append(btn);const panel=document.createElement('section');panel.id='website-package-view';panel.role='tabpanel';panel.setAttribute('aria-labelledby',btn.id);panel.hidden=true;bar.parentElement.append(panel);const style=document.createElement('style');style.textContent=`#website-package-view{padding:24px 0}#website-package-view .wp-card{background:#fff;border:1px solid #d5dde4;border-radius:14px;padding:20px;margin:16px 0;color:#172b3d}#website-package-view .wp-options{display:flex;gap:10px;flex-wrap:wrap}#website-package-view button{padding:12px;cursor:pointer}#website-package-view button[aria-pressed=true]{background:#172b3d;color:white}#website-package-view table{width:100%;border-collapse:collapse}#website-package-view th,#website-package-view td{padding:10px;border-bottom:1px solid #ddd;text-align:left}#website-package-view input{max-width:100%;padding:8px;box-sizing:border-box}#website-package-view input[type=number]{width:110px}#website-package-view .wp-scroll{overflow:auto}#website-package-view .wp-total{font-size:26px;font-weight:700}#website-package-view .wp-meta{display:flex;gap:12px;flex-wrap:wrap}`;document.head.append(style);function activate(t){for(const b of bar.querySelectorAll('[role=tab]')){const on=b===t;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;const p=document.getElementById(b.getAttribute('aria-controls'));if(p)p.hidden=!on;}}bar.addEventListener('click',e=>{const t=e.target.closest('[role=tab]');if(t){e.stopImmediatePropagation();activate(t);}},true);bar.addEventListener('keydown',e=>{const all=[...bar.querySelectorAll('[role=tab]')],i=all.indexOf(e.target);if(i<0)return;const j={ArrowLeft:(i+all.length-1)%all.length,ArrowRight:(i+1)%all.length,Home:0,End:all.length-1}[e.key];if(j!==undefined){e.preventDefault();e.stopImmediatePropagation();activate(all[j]);all[j].focus();}},true);panel.innerHTML=`<h1>網站套餐計價<\/h1><p>網站套餐 v1｜沿用網站對客起價，不再另加15%。金額仍須按度尺及範圍確認。資料暫存於本頁，重新整理會清除。<\/p><div class=\"wp-options\">${data.map((p,i)=>`<button type=\"button\" data-p=\"${i}\">${esc(p.group)}<br>${esc(p.name)}<br>${cash(p.price)} 起<\/button>`).join('')}<\/div><div class=\"wp-card\"><h2 id=\"wp-title\"><\/h2><p id=\"wp-area\"><\/p><ul id=\"wp-features\"><\/ul><p>以下為整套對客價，未有逐項售價，不將套內工序重複計費。網站所列數量只作範圍說明；改動工程範圍後請自行輸入加減項。<\/p><p id=\"wp-warning\"><\/p><\/div><div class=\"wp-card\"><div class=\"wp-meta\"><label>客戶 <input id=\"wp-client\"><\/label><label>工程地址 <input id=\"wp-site\"><\/label><label>報價編號 <input id=\"wp-number\"><\/label><\/div><div class=\"wp-scroll\"><table><thead><tr><th>收費項目<\/th><th>數量<\/th><th>單價 HK$<\/th><th>小計<\/th><th><\/th><\/tr><\/thead><tbody id=\"wp-rows\"><\/tbody><\/table><\/div><button type=\"button\" id=\"wp-add\">新增加項<\/button> <button type=\"button\" id=\"wp-reset\">還原此套餐<\/button><p><label>扣減金額 HK$ <input type=\"number\" min=\"0\" step=\"any\" id=\"wp-discount\" value=\"0\"><\/label><\/p><label>範圍變更／條款 <textarea id=\"wp-note\" rows=\"3\" style=\"width:100%\"><\/textarea><\/label><p class=\"wp-total\" id=\"wp-total\"><\/p><p id=\"wp-error\" role=\"alert\"><\/p><button type=\"button\" id=\"wp-print\">列印／另存PDF<\/button><\/div>`;const $=id=>document.getElementById('wp-'+id);function calc(){const rows=saved[selected];if(rows.some(r=>!r.name.trim()||r.qty===''||r.price===''||![+r.qty,+r.price].every(n=>Number.isFinite(n)&&n>=0)))throw Error('請核對名稱、數量及單價');const base=rows.reduce((s,r)=>s+Math.round(+r.qty*unit(r.price)*100),0),discount=Number($('discount').value);if($('discount').value===''||!Number.isFinite(discount)||discount<0||Math.round(discount*100)>base)throw Error('扣減不可超過小計，亦不可為負數');return {base:base/100,discount,net:(base-Math.round(discount*100))/100};}function update(){try{const t=calc();[...$('rows').children].forEach((el,i)=>{const r=saved[selected][i];el.querySelector('[data-sub]').textContent=cash(Math.round(+r.qty*unit(r.price)*100)/100);});$('total').textContent='報價總額：'+cash(t.net);$('error').textContent='';$('print').disabled=false;}catch(e){$('error').textContent=e.message;$('total').textContent='請核對資料';$('print').disabled=true;}}function render(){const p=data[selected];panel.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.p===selected)));$('title').textContent=p.group+'｜'+p.name;$('area').textContent=p.area+'｜網站起價 '+cash(p.price);$('features').innerHTML=p.features.map(f=>`<li>${esc(f)}<\/li>`).join('');$('warning').textContent=selected===5?'資料待核對：網站標示65呎傢俬，但列出15＋7＋20＋8＝50呎，未列出的15呎不會自行補入。':'';$('rows').innerHTML=saved[selected].map((r,i)=>`<tr data-i=\"${i}\"><td><input data-k=\"name\" aria-label=\"項目\" value=\"${esc(r.name)}\"><\/td><td><input type=\"number\" min=\"0\" step=\"any\" data-k=\"qty\" aria-label=\"數量\" value=\"${esc(r.qty)}\"><\/td><td><input type=\"number\" min=\"0\" step=\"1\" data-k=\"price\" aria-label=\"單價\" value=\"${esc(r.price)}\"><\/td><td data-sub><\/td><td><button type=\"button\" data-del=\"${i}\">移除<\/button><\/td><\/tr>`).join('');update();}panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.p!==undefined){selected=+b.dataset.p;render();}if(b.dataset.del!==undefined){saved[selected].splice(+b.dataset.del,1);render();}});$('rows').addEventListener('input',e=>{if(e.target.dataset.k){saved[selected][+e.target.closest('tr').dataset.i][e.target.dataset.k]=e.target.value;update();}});$('rows').addEventListener('change',e=>{if(e.target.dataset.k==='price'&&e.target.value!==''&&Number.isFinite(e.target.valueAsNumber)&&e.target.valueAsNumber>=0){const r=saved[selected][+e.target.closest('tr').dataset.i];r.price=unit(e.target.value);e.target.value=r.price;update();}});$('discount').oninput=update;$('add').onclick=()=>{saved[selected].push({name:'新增工程',qty:1,price:0});render();};$('reset').onclick=()=>{if(!confirm('還原此套餐收費項目？'))return;saved[selected]=[{name:data[selected].name,qty:1,price:data[selected].price}];render();};$('print').onclick=()=>{try{const t=calc(),p=data[selected],w=window.open('','_blank');if(!w)throw Error('請允許開啟報價列印視窗');w.document.write(`<!doctype html><html lang=\"zh-HK\"><meta charset=\"utf-8\"><title>網站套餐報價單<\/title><style>body{font-family:Arial,sans-serif;margin:35px;line-height:1.7}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}small{display:block}button{padding:12px}@media print{button{display:none}}<\/style><h1>新榮耀工程有限公司｜報價單<\/h1><p>客戶：${esc($('client').value)}<br>地址：${esc($('site').value)}<br>編號：${esc($('number').value)}<br>日期：${new Date().toLocaleDateString('en-CA')}<\/p><h2>${esc(p.group+'｜'+p.name)}<\/h2><p>${esc(p.area)}<\/p><table><tr><th>項目<\/th><th>數量<\/th><th>單價<\/th><th>金額<\/th><\/tr>${saved[selected].map(r=>`<tr><td>${esc(r.name)}<\/td><td>${esc(r.qty)}<\/td><td>HK$ ${unit(r.price).toLocaleString('en-HK')}<\/td><td>${cash(Math.round(+r.qty*unit(r.price)*100)/100)}<\/td><\/tr>`).join('')}<\/table><p>小計：${cash(t.base)}<br>扣減：${cash(t.discount)}<\/p><h2>總額：${cash(t.net)}<\/h2><h3>套餐範圍<\/h3><ul>${p.features.map(f=>`<li>${esc(f)}<\/li>`).join('')}<\/ul><h3>範圍變更／條款<\/h3><p style=\"white-space:pre-wrap\">${esc($('note').value)}<\/p><p>此為預算報價，實際範圍及價格須經雙方確認。<\/p><button onclick=\"window.print()\">列印／另存PDF<\/button><\/html>`);w.document.close();}catch(e){$('error').textContent=e.message;}};render();})();";document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;let text=await f.text();const doc=new </body>');const url=URL.createObjectURL(new Blob([text],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='calculator-with-website-packages.html';a.click();document.getElementById('status').textContent='已產生更新後首頁。先備份，再將下載檔改名index.html，取代計算器首頁。原有其他檔案全部保留。新分頁應顯示「網站套餐 v1」。';setTimeout(()=>URL.revokeObjectURL(url),30000);};</script></body></html>
